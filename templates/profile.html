<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonLight Profile</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            background:#0f172a;
            color:white;
            padding:20px;
        }

        .profile-container{
            max-width:420px;
            margin:auto;
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-bar{
            display:flex;
            align-items:center;
            margin-bottom:25px;
        }

        .back-btn{
            width:45px;
            height:45px;
            border-radius:50%;
            background:#1e293b;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            text-decoration:none;
            font-size:22px;
            margin-right:15px;
            transition:0.3s;
        }

        .back-btn:hover{
            background:#334155;
        }

        .top-bar h1{
            font-size:26px;
        }

        /* =========================
           PROFILE CARD
        ========================= */

        .profile-card{
            background:#111827;
            border-radius:25px;
            padding:30px 25px;
            text-align:center;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
        }

        .profile-img{
            width:120px;
            height:120px;
            border-radius:50%;
            margin:auto;
            background:linear-gradient(135deg,#00c6ff,#0072ff);
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:45px;
            font-weight:bold;
            margin-bottom:18px;
            box-shadow:0 0 20px rgba(0,114,255,0.5);
        }

        .profile-card h2{
            font-size:28px;
            margin-bottom:8px;
        }

        .phone{
            color:#94a3b8;
            margin-bottom:25px;
            font-size:15px;
        }

        /* =========================
           INFO BOX
        ========================= */

        .info-box{
            background:#1e293b;
            padding:16px;
            border-radius:18px;
            margin-bottom:15px;
            text-align:left;
        }

        .info-box label{
            display:block;
            color:#94a3b8;
            font-size:13px;
            margin-bottom:5px;
        }

        .info-box p{
            font-size:16px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .action-btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:16px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            margin-top:14px;
            transition:0.3s;
            text-decoration:none;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .edit-btn{
            background:linear-gradient(135deg,#00c6ff,#0072ff);
            color:white;
            box-shadow:0 0 15px rgba(0,114,255,0.5);
        }

        .edit-btn:hover{
            transform:translateY(-2px);
        }

        .logout-btn{
            background:#1e293b;
            color:white;
        }

        .logout-btn:hover{
            background:#334155;
        }

        .delete-btn{
            background:#dc2626;
            color:white;
        }

        .delete-btn:hover{
            background:#b91c1c;
        }

        @media(max-width:480px){

            body{
                padding:15px;
            }

            .profile-card{
                padding:25px 20px;
            }

            .profile-img{
                width:100px;
                height:100px;
                font-size:38px;
            }

            .profile-card h2{
                font-size:24px;
            }

        }

    </style>

</head>

<body>

    <div class="profile-container">

        <!-- =========================
             TOP BAR
        ========================= -->

        <div class="top-bar">

            <a href="/home" class="back-btn">
                ←
            </a>

            <h1>Profile</h1>

        </div>

        <!-- =========================
             PROFILE CARD
        ========================= -->

        <div class="profile-card">

            <div class="profile-img">
                {{ username[0] }}
            </div>

            <h2>{{ username }}</h2>

            <p class="phone">
                MoonLight Premium User 🚀
            </p>

            <!-- INFO -->

            <div class="info-box">

                <label>Username</label>

                <p>{{ username }}</p>

            </div>

            <div class="info-box">

                <label>Status</label>

                <p>Building MoonLight Chat 🔥</p>

            </div>

            <div class="info-box">

                <label>Account Type</label>

                <p>Premium Member</p>

            </div>

            <!-- BUTTONS -->

            <a href="/home" class="action-btn edit-btn">
                🏠 Back To Home
            </a>

            <a href="/addfriend" class="action-btn logout-btn">
                ➕ Add Friend
            </a>

            <a href="/logout" class="action-btn delete-btn">
                🚪 Logout
            </a>

        </div>

    </div>

</body>

</html>
